# manus-team configuration.
#
# docs/configuration.md sets it up step by step, and its section 7 is the full
# reference: every key, its default, its limits and its environment variable.
#
# Copy to $MT_HOME/config.yaml (default ~/.manus-team/config.yaml), or point
# MT_CONFIG at it. A setting with an environment variable can be set by it, and
# the environment wins, so an emergency override never needs a file edit. The
# kanban: and cron: sections are set in this file only.
#
# CREDENTIALS DO NOT GO IN THIS FILE. The agent runs as the same user as the
# gateway and is not sandboxed in this build, so anything on disk it can read. A
# key that looks like a credential (secret, token, password, apiKey, ...) is
# refused at boot rather than quietly accepted. Secrets live in the gateway's
# own .env, $MT_HOME/.env (default ~/.manus-team/.env), or in the environment,
# which wins over the file name by name:
#
#   LARK_APP_SECRET=...            the Feishu app secret. Required.
#   MT_AGENT_ENV_<NAME>=...       passed to the agent as <NAME>.
#
# The .env must be owner-only (chmod 600), a regular file, not a symlink, or the
# gateway refuses to start. It takes NAME=value lines and # comments on lines
# of their own, as a role's .env does (an unquoted value keeps everything after
# the =, a trailing # note included), and only names the gateway reads from its
# environment: any other, and MT_HOME, MT_CONFIG and MT_DB, are refused.
# LARK_APP_SECRET and MT_AGENT_ENV_* values are masked; paths, ids and limits
# are shown as written. No agent is given the file. Create it, in a shell that
# holds the secret (it refuses if LARK_APP_SECRET is not set, and > replaces an
# existing .env):
#
#   (umask 077; printf 'LARK_APP_SECRET=%s\n' "${LARK_APP_SECRET:?is not set}" > ~/.manus-team/.env) && chmod 600 ~/.manus-team/.env
#
# mt role check reports whether it exists and the names it sets.
#
# An unknown or misspelled key is an error, not a default.

# Absolute path the agent works in. Every session shares it in this build.
workspace: /srv/repo

# Or several named workspaces; `default` is required, and replaces `workspace`:
# workspaces:
#   default: /srv/repos/main
#   docs: /srv/repos/docs
#   # Isolated: each board task gets a directory of its own, so tasks run side by
#   # side. In a plain folder, an empty folder each, whose prompt lists its
#   # parents' folders and names the workspace's own folder for shared inputs.
#   # In a git repository, and only there, a worktree on the branch
#   # mt/<task_id>, started from `base` (unset: whatever the directory has
#   # checked out) or from the task's parents. Nothing is ever merged for you.
#   notes:
#     path: /srv/notes
#     isolated: true
#   web:
#     path: /srv/repos/web
#     isolated: true
#     base: main

# Concurrent agent processes. Sessions beyond this stay cold until one frees up.
maxLiveSessions: 8

# SQLite file and the inbound attachment directory. Both default under $MT_HOME.
# db: /var/lib/manus-team/team.db
# downloads: /var/lib/manus-team/downloads

lark:
  appId: cli_xxxxxxxxxxxxxxxx
  # Feishu when omitted. Set for Lark:
  # domain: https://open.larksuite.com

auth:
  # Always in both tiers below, whatever the lists say: an allowlist that
  # excludes the owner locks out the only person who can fix it. The lists are
  # not editable from chat: /auth grant, and mt auth grant at the terminal, add
  # people beside them, kept in the database, and never remove an entry or the
  # owner. A grant counts at once, with no restart.
  owner: ou_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  # May prompt the agent. An empty list means the owner alone -- empty is
  # CLOSED, never "no restrictions".
  talk:
    - ou_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # Alice, platform team
    - ou_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb # Bob

  # May answer approval cards and run the mutating commands (/new, /attach).
  # Operate needs talk: an entry here that is not also in `talk`, and holds no
  # talk grant, gets neither tier, so list each operator in both.
  operate:
    - ou_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  # Chats the bot will work in, by chat_id (oc_...). Empty means any chat it has
  # been added to. A direct message is a chat too: with a non-empty list, a
  # direct message whose chat is not listed is refused.
  chats: []

  # Answer direct messages without needing a mention.
  directMessages: true

  # Treat @all as addressing the bot. Off, because @all is a room-wide
  # notification and answering announcements is not what anyone wants.
  mentionAll: false

# The role default, when there is no roles/default/. It has no description, so
# /role list shows "–" for what it is for. A role directory's config.yaml
# description, else the first line of its role.md, is what /role list (or
# /roles) shows in chat, to anyone at talk tier, in every chat the gateway acts in: keep in
# neither anything a talk-tier person should not read.
agent:
  # How the agent is run. Two choices:
  #
  #   acp             (default) One process per session, speaking ACP over stdio.
  #                   The only driver that can carry a permission request, so it
  #                   is the only one where approval cards and the operate tier
  #                   mean anything. Use this.
  #   structured-cli  One process per turn, prompt on the command line, output
  #                   read back as JSON (bytesec's run --format json). For agents
  #                   whose ACP server is broken. It cannot ask before acting, so
  #                   it costs the approval flow. Each turn resumes the agent's
  #                   own session by its id, on bytesec 0.7.4 or later; below
  #                   that, resume is unmeasured, and mt role check warns. When
  #                   the agent refuses the id, the turn re-sends the conversation
  #                   as text, which costs input tokens and loses the tool state
  #                   behind it. Requires unsupervised: true below.
  driver: acp

  # The agent binary, on PATH or absolute.
  command: claude-agent-acp

  # A list, or one string split on whitespace with quotes honoured. Not a shell:
  # $HOME and $(...) are passed through literally, because the agent is spawned
  # with shell: false.
  args: []

  # Required by, and only by, structured-cli. A written acknowledgement that the
  # agent will edit files and run commands with no approval card and no gate from
  # the operate allowlist. Setting it next to the acp driver is an error: a config
  # must not claim a posture the gateway is not in.
  # unsupervised: true

  # Variables forwarded to the agent from the gateway's own environment. Names
  # only -- the value stays in the environment. A name listed here that is not
  # set is an error, because forwarding nothing surfaces much later as the agent
  # failing to authenticate.
  #
  # Empty by default, and for a subscription-authenticated agent it should stay
  # that way: the credentials are under $HOME, which is forwarded already. Only
  # list a key here if the agent authenticates by API key.
  passEnv: []
  # passEnv:
  #   - ANTHROPIC_API_KEY

  # Variable names whose values are long but not secret, such as a base URL, so
  # not masked in what the gateway shows and stores.
  # maskExempt:
  #   - ANTHROPIC_BASE_URL

  # The agent's tools that only read. A task with retry_on_crash:
  # if-no-side-effects is retried after a crash only if every tool its run
  # called is listed here.
  # readOnlyTools: []

# The task board. Off by default; these keys are snake_case, as the kanban
# design spells them, and are set in this file only. Its workflows are not
# set here: each is a file of its own, $MT_HOME/workflows/<name>.yaml, read at
# each preview and start, and checked by mt workflow check.
# Each value below is its default, but for max_running_per_role, which has none.
# kanban:
#   enabled: true
#   # Open agent runs at once, across every board and role. Defaults to
#   # maxLiveSessions, and may not be above it; at most 256.
#   max_running: 8
#   # Open agent runs as any one role at once, for a role whose config.yaml sets
#   # no max_running of its own. Unset, a role has no limit of its own. May not
#   # be above max_running.
#   max_running_per_role: 2
#   # Counted failures before a task gives up and blocks, 1 to 100.
#   failure_limit: 2
#   # Throttled runs in a row before a task blocks, 1 to 1000, and the first
#   # wait after one, doubling each time up to an hour, 1 to 3600 s.
#   transient_limit: 10
#   transient_cooldown_s: 300
#   # A run's wall-clock limit unless its task sets one, at most 7 days.
#   default_max_runtime_s: 14400
#   # How often runtimes, cooldowns and stranded tasks are checked, at most
#   # 3600 s, and how long a task nobody can take waits before it is reported
#   # stranded, at most 30 days.
#   sweep_interval_s: 60
#   stranded_after_s: 1800
#   # Reminders to a run whose turn ended with no report, 0 to 10.
#   nudge_limit: 2
#   # Blocks of one kind in a row at which a blocked notice suggests rewriting
#   # the task, 1 to 100.
#   block_recurrence_limit: 2
#   # Wakes (docs/specs/2026-11-19-wake-design.md): a task with wake on starts
#   # a turn of the agent in the thread that follows it when it completes, has
#   # changes requested, is blocked by its run, gives up or is stranded. On by
#   # default, but nothing while enabled above is off; a wake is opt-in per task.
#   wake:
#     enabled: true
#     # Woken turns per conversation in any hour, 1 to 60.
#     per_hour: 6
#     # A task this many woken turns deep stays notice-only, 1 to 20.
#     max_depth: 5
#     # How long a block's Unblock button waits for the agent's try, 1 to 60.
#     hold_minutes: 10
#   # Progress cards (docs/specs/2026-11-24-progress-cards-design.md): a live
#   # card for each agent run past min_seconds (0 to 3600), in its task's thread
#   # or direct message. Off by default. Everyone in the thread sees it, talk
#   # tier or not: each tool's title, which can hold a command line or a path,
#   # and the agent's words mid-run. Only the secrets the gateway knows are
#   # masked.
#   progress:
#     enabled: true
#     min_seconds: 30

# Cron jobs (docs/specs/2026-11-16-cron-design.md): a schedule, a role, a prompt
# and an optional script, fired by the gateway into a fresh session of the role,
# its answer posted to the chat that made the job. Off by default: with it off,
# no chat session's agent gets a token or a changed PATH, and /cron says cron is
# off. Snake case, and set in this file only.
# cron:
#   enabled: true
#   # Fires at once, apart from the board's runs; from 1 to 16. A job's role
#   # must be unsupervised: nobody watches a fire.
#   max_running: 2
#   # A fire's turn with no activity this long is cancelled; from 60 to 86400.
#   idle_timeout_s: 600
#   # The zone a job gets when none is given; unset, the gateway's own. Every
#   # job keeps the zone it was given.
#   tz: Asia/Shanghai
