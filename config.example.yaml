# manus-team configuration.
#
# Copy to $MT_HOME/config.yaml (default ~/.manus-team/config.yaml), or point
# MT_CONFIG at it. Every setting here is also settable by environment variable,
# and the environment wins -- so an emergency override never needs a file edit.
#
# CREDENTIALS DO NOT GO IN THIS FILE. The agent runs as the same user as the
# gateway and is not sandboxed in this build, so anything on disk it can read. A
# key that looks like a credential (secret, token, password, apiKey, ...) is
# refused at boot rather than quietly accepted. Secrets live in the gateway's
# own .env, $MT_HOME/.env (default ~/.manus-team/.env), or in the environment,
# which wins over the file name by name:
#
#   LARK_APP_SECRET=...            the Feishu app secret. Required.
#   MT_AGENT_ENV_<NAME>=...       passed to the agent as <NAME>.
#
# The .env must be owner-only (chmod 600), a regular file, not a symlink, or the
# gateway refuses to start. It takes NAME=value lines and # comments on lines
# of their own, as a role's .env does (an unquoted value keeps everything after
# the =, a trailing # note included), and only names the gateway reads from its
# environment: any other, and MT_HOME, MT_CONFIG and MT_DB, are refused.
# LARK_APP_SECRET and MT_AGENT_ENV_* values are masked; paths, ids and limits
# are shown as written. No agent is given the file. Create it, in a shell that
# holds the secret (it refuses if LARK_APP_SECRET is not set, and > replaces an
# existing .env):
#
#   (umask 077; printf 'LARK_APP_SECRET=%s\n' "${LARK_APP_SECRET:?is not set}" > ~/.manus-team/.env) && chmod 600 ~/.manus-team/.env
#
# mt role check reports whether it exists and the names it sets.
#
# An unknown or misspelled key is an error, not a default.

# Absolute path the agent works in. Every session shares it in this build.
workspace: /srv/repo

# Or several named workspaces; `default` is required, and replaces `workspace`:
# workspaces:
#   default: /srv/repos/main
#   docs: /srv/repos/docs
#   # Isolated: each board task gets a directory of its own, so tasks run side by
#   # side. In a plain folder, an empty folder each, whose prompt lists its
#   # parents' folders and names the workspace's own folder for shared inputs.
#   # In a git repository, and only there, a worktree on the branch
#   # mt/<task_id>, started from `base` (unset: whatever the directory has
#   # checked out) or from the task's parents. Nothing is ever merged for you.
#   notes:
#     path: /srv/notes
#     isolated: true
#   web:
#     path: /srv/repos/web
#     isolated: true
#     base: main

# Concurrent agent processes. Sessions beyond this stay cold until one frees up.
maxLiveSessions: 8

# SQLite file and the inbound attachment directory. Both default under $MT_HOME.
# db: /var/lib/manus-team/team.db
# downloads: /var/lib/manus-team/downloads

lark:
  appId: cli_xxxxxxxxxxxxxxxx
  # Feishu when omitted. Set for Lark:
  # domain: https://open.larksuite.com

auth:
  # Always in both tiers below, whatever the lists say: an allowlist that
  # excludes the owner locks out the only person who can fix it, and it is not
  # editable from chat.
  owner: ou_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  # May prompt the agent. An empty list means the owner alone -- empty is
  # CLOSED, never "no restrictions".
  talk:
    - ou_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # Alice, platform team
    - ou_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb # Bob

  # May answer approval cards and run the mutating commands (/new, /attach).
  # A strict subset of `talk` in most deployments.
  operate:
    - ou_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  # Chats the bot will work in. Empty means any chat it has been added to.
  chats: []

  # Answer direct messages without needing a mention.
  directMessages: true

  # Treat @all as addressing the bot. Off, because @all is a room-wide
  # notification and answering announcements is not what anyone wants.
  mentionAll: false

agent:
  # How the agent is run. Two choices:
  #
  #   acp             (default) One process per session, speaking ACP over stdio.
  #                   The only driver that can carry a permission request, so it
  #                   is the only one where approval cards and the operate tier
  #                   mean anything. Use this.
  #   structured-cli  One process per turn, prompt on the command line, output
  #                   read back as JSON. For agents whose ACP server is broken.
  #                   It cannot ask before acting and cannot resume a session --
  #                   each turn re-sends the conversation as text -- so it costs
  #                   both the approval flow and input tokens. Requires
  #                   unsupervised: true below.
  driver: acp

  # The agent binary, on PATH or absolute.
  command: claude-agent-acp

  # A list, or one string split on whitespace with quotes honoured. Not a shell:
  # $HOME and $(...) are passed through literally, because the agent is spawned
  # with shell: false.
  args: []

  # Required by, and only by, structured-cli. A written acknowledgement that the
  # agent will edit files and run commands with no approval card and no gate from
  # the operate allowlist. Setting it next to the acp driver is an error: a config
  # must not claim a posture the gateway is not in.
  # unsupervised: true

  # Variables forwarded to the agent from the gateway's own environment. Names
  # only -- the value stays in the environment. A name listed here that is not
  # set is an error, because forwarding nothing surfaces much later as the agent
  # failing to authenticate.
  #
  # Empty by default, and for a subscription-authenticated agent it should stay
  # that way: the credentials are under $HOME, which is forwarded already. Only
  # list a key here if the agent authenticates by API key.
  passEnv: []
  # passEnv:
  #   - ANTHROPIC_API_KEY

# The task board. Off by default; these keys are snake_case, as the kanban
# design spells them, and are set in this file only.
# kanban:
#   enabled: true
#   # Open agent runs at once, across every board and role. Defaults to
#   # maxLiveSessions, and may not be above it.
#   max_running: 6
#   # Open agent runs as any one role at once, for a role whose config.yaml sets
#   # no max_running of its own. Unset, a role has no limit of its own. May not
#   # be above max_running.
#   max_running_per_role: 2
